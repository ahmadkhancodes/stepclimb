key: tests.pest-3
category: tests
version: "12"
title: Laravel 12 requires pestphp/pest ^3.0
# Matches Composer solver output that names the package as a root requirement; the guard
# makes sure composer.json really declares a constraint outside the supported range.
signature: '(?:Root composer\.json requires|Root composer\.json and) pestphp/pest (?<constraint>[^\s,]+)'
contextGuard:
  kind: composer_constraint
  package: pestphp/pest
  notSatisfies: "^3.0"
fix:
  kind: composer_constraint
  params:
    package: pestphp/pest
    constraint: "^3.0"
    section: require-dev
sources:
  - https://laravel.com/docs/12.x/upgrade#updating-dependencies
unverified: false
