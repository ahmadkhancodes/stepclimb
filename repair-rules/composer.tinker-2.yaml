key: composer.tinker-2
category: composer
version: "11"
title: Laravel 11 needs laravel/tinker ^2.9
# Failure text follows Composer's solver format. Constraint taken from the package's own release notes, not the Laravel guide: confirm against a real run.
signature: '(?:Root composer\.json requires|Root composer\.json and) laravel/tinker (?<constraint>[^\s,]+)'
contextGuard:
  kind: composer_constraint
  package: laravel/tinker
  notSatisfies: "^2.9"
  section: require
fix:
  kind: composer_constraint
  params:
    package: laravel/tinker
    constraint: "^2.9"
    section: require
sources:
  - https://laravel.com/docs/11.x/upgrade
unverified: true
