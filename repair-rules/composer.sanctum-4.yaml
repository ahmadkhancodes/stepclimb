key: composer.sanctum-4
category: composer
version: "11"
title: Laravel 11 requires laravel/sanctum ^4.0
# Matches Composer solver output that names the package as a root requirement; the guard
# makes sure composer.json really declares a constraint outside the supported range.
signature: '(?:Root composer\.json requires|Root composer\.json and) laravel/sanctum (?<constraint>[^\s,]+)'
contextGuard:
  kind: composer_constraint
  package: laravel/sanctum
  notSatisfies: "^4.0"
fix:
  kind: composer_constraint
  params:
    package: laravel/sanctum
    constraint: "^4.0"
    section: require
sources:
  - https://laravel.com/docs/11.x/upgrade#sanctum
unverified: false
