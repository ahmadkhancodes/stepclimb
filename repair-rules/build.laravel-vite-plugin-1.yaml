key: build.laravel-vite-plugin-1
category: build
version: any
title: laravel-vite-plugin 1.x for Vite 5 and 6
# npm peer dependency failure text is a guess; the guard only fires when the plugin is declared below ^1.0.
signature: 'laravel-vite-plugin[^\n]*(?:ERESOLVE|peer vite|Could not resolve)'
contextGuard:
  kind: file_regex
  path: package.json
  pattern: '"laravel-vite-plugin"\s*:\s*"\^0\.'
fix:
  kind: config_patch
  params:
    file: package.json
    replace:
      - pattern: '(?<="laravel-vite-plugin"\s*:\s*)"\^0\.[^"]*"'
        replacement: '"^1.0.0"'
sources:
  - https://laravel.com/docs/12.x/vite
unverified: true
