key: composer.laravel-11-php-8-2
category: composer
version: "11"
title: Root php constraint allows PHP older than Laravel 11 minimum (8.2.0)
signature: 'laravel/framework\S* requires? php \^8\.2 -> your php version \((?<php>[^)]+)\) does not satisfy that requirement'
contextGuard:
  kind: composer_constraint
  package: php
  notSatisfies: "^8.2"
  section: require
fix:
  kind: composer_constraint
  params:
    package: php
    constraint: "^8.2"
    section: require
sources:
  - https://laravel.com/docs/11.x/upgrade#updating-dependencies
unverified: false
