key: tests.phpunit-11
category: tests
version: "12"
title: Laravel 12 requires phpunit/phpunit ^11.0
# Matches Composer solver output that names the package as a root requirement; the guard
# makes sure composer.json really declares a constraint outside the supported range.
signature: '(?:Root composer\.json requires|Root composer\.json and) phpunit/phpunit (?<constraint>[^\s,]+)'
contextGuard:
  kind: composer_constraint
  package: phpunit/phpunit
  notSatisfies: "^11.0"
fix:
  kind: composer_constraint
  params:
    package: phpunit/phpunit
    constraint: "^11.0"
    section: require-dev
sources:
  - https://laravel.com/docs/12.x/upgrade#updating-dependencies
unverified: false
