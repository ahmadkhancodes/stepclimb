key: composer.horizon-5
category: composer
version: "11"
title: Laravel 11 needs laravel/horizon ^5.24
# Failure text follows Composer's solver format. Constraint taken from the package's own release notes, not the Laravel guide: confirm against a real run.
signature: '(?:Root composer\.json requires|Root composer\.json and) laravel/horizon (?<constraint>[^\s,]+)'
contextGuard:
  kind: composer_constraint
  package: laravel/horizon
  notSatisfies: "^5.24"
  section: require
fix:
  kind: composer_constraint
  params:
    package: laravel/horizon
    constraint: "^5.24"
    section: require
sources:
  - https://laravel.com/docs/11.x/upgrade
unverified: true
