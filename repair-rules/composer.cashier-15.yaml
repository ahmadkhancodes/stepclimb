key: composer.cashier-15
category: composer
version: "11"
title: Laravel 11 requires laravel/cashier ^15.0
# Matches Composer solver output that names the package as a root requirement; the guard
# makes sure composer.json really declares a constraint outside the supported range.
signature: '(?:Root composer\.json requires|Root composer\.json and) laravel/cashier (?<constraint>[^\s,]+)'
contextGuard:
  kind: composer_constraint
  package: laravel/cashier
  notSatisfies: "^15.0"
fix:
  kind: composer_constraint
  params:
    package: laravel/cashier
    constraint: "^15.0"
    section: require
sources:
  - https://laravel.com/docs/11.x/upgrade#cashier-stripe
unverified: false
