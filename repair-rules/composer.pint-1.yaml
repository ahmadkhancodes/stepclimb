key: composer.pint-1
category: composer
version: "11"
title: Laravel 11 needs laravel/pint ^1.13
# Failure text follows Composer's solver format. Constraint taken from the package's own release notes, not the Laravel guide: confirm against a real run.
signature: '(?:Root composer\.json requires|Root composer\.json and) laravel/pint (?<constraint>[^\s,]+)'
contextGuard:
  kind: composer_constraint
  package: laravel/pint
  notSatisfies: "^1.13"
  section: require-dev
fix:
  kind: composer_constraint
  params:
    package: laravel/pint
    constraint: "^1.13"
    section: require-dev
sources:
  - https://laravel.com/docs/11.x/upgrade
unverified: true
