key: composer.breeze-2
category: composer
version: "11"
title: Laravel 11 needs laravel/breeze ^2.0
# Failure text follows Composer's solver format. Constraint taken from the package's own release notes, not the Laravel guide: confirm against a real run.
signature: '(?:Root composer\.json requires|Root composer\.json and) laravel/breeze (?<constraint>[^\s,]+)'
contextGuard:
  kind: composer_constraint
  package: laravel/breeze
  notSatisfies: "^2.0"
  section: require-dev
fix:
  kind: composer_constraint
  params:
    package: laravel/breeze
    constraint: "^2.0"
    section: require-dev
sources:
  - https://laravel.com/docs/11.x/upgrade
unverified: true
